- name: Rolling deploy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check there is something to fail over to
      ansible.builtin.assert:
        that: app_instances | length >= 2
        quiet: true

    - name: Prepare image, network and config directory
      ansible.builtin.include_tasks: tasks/prepare.yml

    - name: Look at the instances that exist now
      community.docker.docker_container_info:
        name: "zdd-{{ item }}"
      loop: "{{ app_instances }}"
      register: before
      loop_control:
        label: "{{ item }}"

    - name: Remember what is running now
      vars:
        existing: "{{ before.results | selectattr('exists') | list }}"
      ansible.builtin.set_fact:
        lb_pool: "{{ existing | selectattr('container.State.Running') | map(attribute='item') | list }}"
        previous_images: "{{ dict(existing | map(attribute='item') | zip(existing | map(attribute='container.Config.Image'))) }}"

    - name: Roll out the release
      block:
        - name: Roll the instances one at a time
          ansible.builtin.include_tasks: tasks/roll_instance.yml
          loop: "{{ app_instances }}"
          loop_control:
            loop_var: instance
          vars:
            image: "{{ app_image }}:{{ app_version }}"
            fault: true

      rescue:
        # Instances before the failed one may already run the new release, so go
        # back through all of them. Last first: the failed one is out of the pool
        # and the others keep serving while it is restored.
        - name: Put the previous release back
          ansible.builtin.include_tasks: tasks/roll_instance.yml
          loop: "{{ app_instances | reverse | select('in', previous_images) | list }}"
          loop_control:
            loop_var: instance
          vars:
            image: "{{ previous_images[instance] }}"
            fault: false

        - name: Remove instances that had no previous release
          community.docker.docker_container:
            name: "zdd-{{ item }}"
            state: absent
          loop: "{{ app_instances | reject('in', previous_images) | list }}"

        - name: Stop the play
          ansible.builtin.fail:
            msg: "{{ app_version }} was rolled back, failed task: {{ ansible_failed_task.name }}"

    - name: Make sure nginx lists the final pool
      ansible.builtin.include_tasks: tasks/set_pool.yml

    - name: Run nginx
      ansible.builtin.include_tasks: tasks/run_nginx.yml
