- name: Rolling deploy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check there is something to fail over to
      ansible.builtin.assert:
        that: app_instances | length >= 2
        quiet: true

    - name: Prepare image, network and config directory
      ansible.builtin.include_tasks: tasks/prepare.yml

    - name: Look at the instances that exist now
      community.docker.docker_container_info:
        name: "zdd-{{ item }}"
      loop: "{{ app_instances }}"
      register: before
      loop_control:
        label: "{{ item }}"

    - name: Remember who is in the pool
      ansible.builtin.set_fact:
        lb_pool: "{{ before.results | selectattr('exists') | selectattr('container.State.Running') | map(attribute='item') | list }}"

    - name: Roll the instances one at a time
      ansible.builtin.include_tasks: tasks/roll_instance.yml
      loop: "{{ app_instances }}"
      loop_control:
        loop_var: instance
      vars:
        image: "{{ app_image }}:{{ app_version }}"
        fault: true

    - name: Make sure nginx lists the final pool
      ansible.builtin.include_tasks: tasks/set_pool.yml

    - name: Run nginx
      ansible.builtin.include_tasks: tasks/run_nginx.yml
