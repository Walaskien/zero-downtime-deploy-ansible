- name: Rolling deploy behind nginx
  hosts: localhost
  gather_facts: false
  vars_files: [vars.yml]
  tasks:
    - name: Need at least two instances to roll without downtime
      ansible.builtin.assert:
        that: app_instances | length >= 2

    - name: Build the application image
      community.docker.docker_image:
        name: "{{ app_image }}"
        tag: "{{ app_version }}"
        source: build
        build:
          path: "{{ playbook_dir }}/../app"
        force_source: false

    - name: Create the network
      community.docker.docker_network:
        name: "{{ network_name }}"

    - name: Create the state directory
      ansible.builtin.file:
        path: "{{ state_dir }}/nginx"
        state: directory
        mode: "0755"

    - name: Roll instances one at a time
      ansible.builtin.include_tasks: tasks_instance.yml
      loop: "{{ app_instances }}"

    - name: Make sure the nginx config lists every instance
      ansible.builtin.include_tasks: tasks_nginx_conf.yml

    - name: Run nginx
      community.docker.docker_container:
        name: zdd-lb
        image: nginx:1.27-alpine
        state: started
        restart_policy: unless-stopped
        networks: [{name: "{{ network_name }}"}]
        published_ports: ["{{ lb_port }}:80"]
        volumes: ["{{ state_dir | realpath }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
