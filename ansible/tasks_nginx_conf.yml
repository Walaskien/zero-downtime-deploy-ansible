# Renders the nginx config for every instance except those in `lb_exclude`, then reloads nginx if the file changed.
- name: Render nginx upstream
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ state_dir }}/nginx/default.conf"
    mode: "0644"
  vars:
    lb_members: "{{ app_instances | difference(lb_exclude | default([])) }}"
  register: nginx_conf

- name: Check that nginx is running
  community.docker.docker_container_info:
    name: zdd-lb
  register: lb_info

- name: Reload nginx (graceful: old workers finish their requests)
  community.docker.docker_container_exec:
    container: zdd-lb
    command: nginx -s reload
  when: nginx_conf.changed and lb_info.exists and lb_info.container.State.Running
