- name: "{{ item }}: start {{ run_image }}"
  community.docker.docker_container:
    name: "zdd-{{ item }}"
    image: "{{ run_image }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    networks: [{name: "{{ network_name }}"}]
    published_ports: ["{{ 8081 + app_instances.index(item) }}:8000"]
    env:
      APP_VERSION: "{{ run_image.split(':')[1] }}"
      STARTUP_DELAY: "{{ app_startup_delay }}"
      BROKEN: "{{ '1' if run_broken | bool else '0' }}"

- name: "{{ item }}: wait until healthy"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ 8081 + app_instances.index(item) }}/health"
    status_code: 200
  register: health
  retries: "{{ health_retries }}"
  delay: 1
  until: health.status == 200
