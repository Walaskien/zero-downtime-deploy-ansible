# Writes the nginx upstream from the lb_pool fact and reloads nginx if it changed.
- name: Render nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ state_dir }}/nginx/app.conf"
    mode: "0644"
  register: nginx_conf

- name: Look up nginx
  community.docker.docker_container_info:
    name: "{{ nginx_container }}"
  register: nginx_info

# nginx -s reload exits 0 even when the new config is rejected, so check it first
- name: Test nginx config
  community.docker.docker_container_exec:
    container: "{{ nginx_container }}"
    command: nginx -t
  when: nginx_conf.changed and nginx_info.exists and nginx_info.container.State.Running

- name: Reload nginx
  community.docker.docker_container_exec:
    container: "{{ nginx_container }}"
    command: nginx -s reload
  when: nginx_conf.changed and nginx_info.exists and nginx_info.container.State.Running
