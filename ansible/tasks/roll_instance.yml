---
# Moves one instance to `image`. It leaves the pool first, so nginx stops
# sending it requests before its container goes away, and it only comes back
# once /health answers.
- name: Look up container {{ instance }}
  community.docker.docker_container_info:
    name: "zdd-{{ instance }}"
  register: current

- name: Replace container {{ instance }}
  when: not (current.exists and current.container.State.Running and current.container.Config.Image == image)
  vars:
    host_port: "{{ health_base_port + app_instances.index(instance) }}"
  block:
    # A fact, not "instance in lb_pool" in the when: below. A block's condition is
    # checked again for every task inside, and lb_pool changes in its first one.
    - name: Check pool membership {{ instance }}
      ansible.builtin.set_fact:
        was_pooled: "{{ instance in lb_pool }}"

    - name: Take out of the pool {{ instance }}
      when: was_pooled
      block:
        - name: Drop from lb_pool {{ instance }}
          ansible.builtin.set_fact:
            lb_pool: "{{ lb_pool | difference([instance]) }}"

        - name: Reload nginx without it {{ instance }}
          ansible.builtin.include_tasks: set_pool.yml

        - name: Let in-flight requests finish {{ instance }}
          ansible.builtin.pause:
            seconds: "{{ drain_seconds }}"

    - name: Start container {{ instance }}
      community.docker.docker_container:
        name: "zdd-{{ instance }}"
        image: "{{ image }}"
        state: started
        recreate: true
        image_name_mismatch: recreate
        restart_policy: unless-stopped
        networks:
          - name: "{{ network_name }}"
        published_ports:
          - "127.0.0.1:{{ host_port }}:8000"
        env:
          STARTUP_DELAY: "{{ startup_delay | string }}"
          BROKEN: "{{ '1' if (fault and instance in broken_on) else '0' }}"

    - name: Wait until healthy {{ instance }}
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ host_port }}/health"
        status_code: 200
      register: health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health.status == 200

    - name: Add to lb_pool {{ instance }}
      ansible.builtin.set_fact:
        lb_pool: "{{ lb_pool + [instance] }}"

    - name: Reload nginx with it {{ instance }}
      ansible.builtin.include_tasks: set_pool.yml
